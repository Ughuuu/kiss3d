[package]
authors = ["Sébastien Crozet <developer@crozet.re>"]
name    = "kiss3d"
version = "0.47.0"

autoexamples = true
description  = "Keep it simple, stupid, 2D and 3D graphics engine for Rust."
edition      = "2018"
keywords     = ["graphics", "wgpu", "KISS"]
license      = "BSD-3-Clause"
readme       = "README.md"
repository   = "https://github.com/dimforge/kiss3d"

include = [
    "src/**/*.rs",
    "src/**/*.wgsl",
    "src/text/*.ttf",
    "src/builtin/tony_mc_mapface.bin",
    "examples/**/*.rs",
    "examples/media",
    "examples/Cargo.toml",
    "Cargo.toml",
    "/LICENSE",
    "/Readme.md",
]


[lib]
name = "kiss3d"
path = "src/lib.rs"

[features]
default = ["text", "egui-default-fonts", "image-formats"]
# `rfd` powers the inspector's native "Open…" image dialogs (unused on wasm, which
# falls back to a path text field). `accesskit_winit` is the platform's way into a
# window for a screen reader, made only for one opened with `CanvasSetup::accessible`.
egui = ["dep:egui", "dep:egui-wgpu", "dep:rfd", "dep:accesskit_winit", "dep:accesskit_ios"]
recording = ["dep:ffmpeg-the-third"]
serde = ["dep:serde", "glamx/serde", "bitflags/serde", "rgb/serde", "wgpu/serde"]
# If enabled, switching between the ray-tracer and the rasterizer is possible while kipping
# only the `.render_3d` call (instead of having to manually switch between `.render_3d` and
# `.raytrace_3d`. This is mainly for debugging and experiments comparing the rasterizer and
# the raytracer.
rt_switcher = []
# `Window::draw_text` and `text::Font` over rusttype, and the WorkSans face the
# egui renderer starts from. An app with its own text stack turns it off.
text = ["dep:rusttype"]
# egui's bundled faces (Ubuntu-Light, Hack and two emoji fonts); off, the app
# hands egui its fonts.
egui-default-fonts = ["egui?/default_fonts"]
# Every format the image crate decodes; off, PNG and JPEG only.
image-formats = ["image/default-formats"]

[dependencies]
bitflags     = "2"
bytemuck     = { version = "1", features = ["derive"] }
egui         = { version = "0.37", optional = true, default-features = false }
egui-wgpu    = { version = "0.37", optional = true }
gltf         = { version = "1.4", features = ["import", "utils", "names"] }
image        = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log          = "0.4"
web-time     = "1"
kiss3d-macro = { version = "0.36.1", path = "kiss3d-macro" }
glamx         = { version = "0.3", features = ["bytemuck"] }
ffmpeg-the-third = { version = "4", optional = true }
num-traits   = "0.2"
rgb          = "0.8"
rusttype     = { version = "0.9", features = ["gpu_cache"], optional = true }
serde        = { version = "1", features = ["derive"], optional = true }
wgpu         = "30"
winit        = "0.30"

# Every built-in shader is linked here, so a program carries WGSL and no linker.
[build-dependencies]
wesl = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"

# rfd has desktop and wasm backends only; on iOS/Android its dialog traits have
# no implementation and the crate does not compile. The inspector falls back to
# its path text field there, same as on wasm.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
rfd = { version = "0.17", optional = true }

# Egui's accesskit, across to the platform. Not on the web, which needs a DOM to
# mirror a tree into, nor on Android, whose adapter reaches for GameActivity's view
# and this crate runs on NativeActivity. On iOS UIKit's adapter directly: the
# winit one asks winit whether the window is visible, and winit answers by warning.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
accesskit_winit = { version = "0.34", optional = true }

# android-activity (under winit) requires the app to pick exactly one glue
# backend and compiles nothing without it. NativeActivity is the pure-Rust
# choice: no Java/Gradle subclass needed.
# 0.6.1 minimum: that release fixed show_soft_input on NativeActivity, which
# `set_keyboard_visible` relies on.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android-activity = "0.6.1"

# The on-screen keyboard: winit has no iOS IME support, so `set_keyboard_visible`
# summons UIKit's keyboard itself through a hidden UIKeyInput view (window/ios.rs).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSValue"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIGeometry", "UIResponder", "UIView", "UITextInput", "UIWindow", "objc2-core-foundation"] }
# A screen reader's way in on iOS; see the note on `accesskit_winit`.
accesskit_ios = { version = "0.2.2", optional = true }

[target.wasm32-unknown-unknown.dependencies]
oneshot = { version = "0.2.0", features = ["async"] }
# We depend on getrandom 0.3 only to enable its wasm_js feature.
# And this is needed only because some dependencies still depend on 0.3.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.54"
web-sys = { version = "0.3", features = [
    "console",
    "KeyEvent",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "Touch",
    "TouchEvent",
    "TouchList",
    "HtmlCanvasElement",
    "HtmlElement",
    "Navigator",
    "Window",
    "UiEvent",
    "Event",
    "EventTarget",
    "Element",
    "DomRect",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"

# AppKit wants its main thread, which a test harness keeps for itself.
[[test]]
name = "access_adapter"
harness = false
required-features = ["egui"]

[[test]]
name = "surface_follows_window"
harness = false
required-features = ["egui"]

[[example]]
name = "text"
required-features = ["text"]

[[example]]
name = "dda_raycast2d"
required-features = ["text"]

[[example]]
name = "material_pbr"
required-features = ["text"]

[[example]]
name = "raytracing"
required-features = ["text"]

[dev-dependencies]
env_logger = "0.11"
rand       = "0.10"
# Writes every built-in shader as the GLSL ES a GLES device compiles.
naga       = { version = "30", features = ["wgsl-in", "glsl-out"] }

[patch.crates-io]
#glamx = { path = "../glamx" }